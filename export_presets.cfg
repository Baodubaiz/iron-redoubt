html/head_include="<script src=\"https://sdk.crazygames.com/crazygames-sdk-v3.js\"></script>\n<style>body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}</style>\n<script>(function(){var h=location.hostname;if(h==='crazygames.com'||h.endsWith('.crazygames.com'))return;var css=document.createElement('style');css.textContent='#ir-rotate{position:fixed;top:12px;left:50%;transform:translate(-50%,-8px);z-index:99999;max-width:88vw;padding:10px 16px;border-radius:10px;background:rgba(7,11,22,.92);border:1px solid #2FD3F5;color:#E6EBF5;font:600 15px sans-serif;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s ease,transform .35s ease}#ir-rotate.on{opacity:1;transform:translate(-50%,0)}';document.head.appendChild(css);var mq=window.matchMedia('(orientation: portrait) and (pointer: coarse)');var el=null,timer=0;function show(){if(!document.body)return;if(!el){el=document.createElement('div');el.id='ir-rotate';el.innerHTML='&#x21BB; Rotate your device for a better view<br><span style=\"opacity:.75;font-size:13px\">Xoay ngang &#273;i&#7879;n tho&#7841;i &#273;&#7875; ch&#417;i d&#7877; h&#417;n</span>';document.body.appendChild(el);}el.classList.add('on');clearTimeout(timer);timer=setTimeout(function(){el.classList.remove('on');},4000);}function check(){if(mq.matches)show();else if(el)el.classList.remove('on');}if(mq.addEventListener)mq.addEventListener('change',check);else if(mq.addListener)mq.addListener(check);window.addEventListener('load',function(){setTimeout(check,600);});})();</script>"
