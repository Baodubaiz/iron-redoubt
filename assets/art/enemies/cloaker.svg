<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-32 -32 64 64">
<defs>
  <linearGradient id="cl_hull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3D2952"/>
    <stop offset="1" stop-color="#170F20"/>
  </linearGradient>
  <radialGradient id="cl_lens">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.45" stop-color="#DF9FFF"/>
    <stop offset="1" stop-color="#6B1E9C"/>
  </radialGradient>
</defs>
<!-- Phase Distort Wave Rings -->
<ellipse cx="0" cy="0" rx="27" ry="17" fill="none" stroke="#C784FF" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>
<!-- 3 Outer Phase Emitter Pods -->
<circle cx="20" cy="0" r="4.5" fill="#140D1D" stroke="#DF9FFF" stroke-width="1.5"/>
<circle cx="20" cy="0" r="2" fill="#EBD2FF"/>
<circle cx="-14" cy="-18" r="4.5" fill="#140D1D" stroke="#DF9FFF" stroke-width="1.5"/>
<circle cx="-14" cy="-18" r="2" fill="#EBD2FF"/>
<circle cx="-14" cy="18" r="4.5" fill="#140D1D" stroke="#DF9FFF" stroke-width="1.5"/>
<circle cx="-14" cy="18" r="2" fill="#EBD2FF"/>
<!-- Geometric Refraction Triangular Chassis -->
<polygon points="20,0 -16,-18 -8,0 -16,18" fill="url(#cl_hull)" stroke="#DF9FFF" stroke-width="2" stroke-linejoin="round"/>
<!-- Optical Cloaking Eye / Mirror Core -->
<polygon points="6,0 -8,-7 -4,0 -8,7" fill="#0E0716" stroke="#9A4ED9" stroke-width="1.5"/>
<circle cx="-2" cy="0" r="4.5" fill="url(#cl_lens)"/>
</svg>
